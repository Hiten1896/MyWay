name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Frontend
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          RENDER_API_URL: ${{ vars.RENDER_API_URL }}
        run: |
          npm ci
          npm run build
          printf "window.TMDB_API_KEY = '%s';\nwindow.MYWAY_API_BASE_URL = '%s';\n" "$TMDB_API_KEY" "$RENDER_API_URL" > dist/config.js

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4